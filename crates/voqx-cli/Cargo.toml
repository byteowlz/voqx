[package]
name = "voqx-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
description = "voqx CLI: manage the shared Voice Identity registry, enroll voices, and import existing tool-local stores."

[lints]
workspace = true

[[bin]]
name = "voqx"
path = "src/main.rs"

[features]
default = ["recognition"]
# WeSpeaker embeddings via voqx-recognition (pulls ONNX Runtime). Disable for a
# registry-only CLI with no native ML dependencies.
recognition = ["dep:voqx-recognition"]

[dependencies]
voqx-core.workspace = true
voqx-recognition = { workspace = true, optional = true }
hound.workspace = true
rubato.workspace = true
anyhow.workspace = true
clap.workspace = true
clap_complete.workspace = true
env_logger.workspace = true
log.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
toml.workspace = true
