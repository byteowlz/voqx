[package]
name = "voqx-recognition"
description = "Embeddable CPU speaker encoders and portable, versioned speaker-attribution evidence for voqx."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
voqx-core = { workspace = true, optional = true }
anyhow.workspace = true
thiserror.workspace = true
serde.workspace = true
# Preserve exact f64 diagnostic scores across the JSON/WASM seam.
serde_json = { workspace = true, features = ["float_roundtrip"] }
sha2.workspace = true
log = { workspace = true, optional = true }
hound = { workspace = true, optional = true }
speakrs = { workspace = true, optional = true }
ort = { workspace = true, optional = true }
wasm-bindgen = { workspace = true, optional = true }
# Select rustls for the existing speakrs runtime download as well.
ort-sys = { version = "=2.0.0-rc.12", default-features = false, features = ["tls-rustls", "download-binaries"], optional = true }

[features]
default = ["wespeaker"]
wespeaker = ["registry", "dep:speakrs", "dep:ort-sys", "dep:log", "dep:hound"]
registry = ["dep:voqx-core"]
fastdiar = ["dep:ort"]
wasm = ["dep:wasm-bindgen"]
coreml = ["wespeaker", "speakrs/coreml"]
cuda = ["wespeaker", "speakrs/cuda"]

[dev-dependencies]
hound.workspace = true
tempfile = "3"

[lints]
workspace = true
